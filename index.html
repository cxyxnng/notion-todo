/* ── Setup overlay ── */
#setupOverlay {
  position: fixed;
  inset: 0;
  background: rgba(249,218,228,0.55);
  backdrop-filter: blur(6px);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
.setup-card {
  width: 320px;
  background: #fff;
  border-radius: 14px;
  border: 2px solid var(--main-pink);
  box-shadow: 4px 4px 0 var(--heart-accent);
  padding: 24px 20px 20px;
}
.setup-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--heart-accent);
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
}
.setup-label {
  font-size: 11px;
  color: var(--text-gray);
  margin-bottom: 4px;
  margin-top: 10px;
}
.setup-input {
  width: 100%;
  height: 34px;
  padding: 0 10px;
  border: 1.5px solid var(--main-pink);
  border-radius: 6px;
  font-size: 12px;
  outline: none;
  color: #444;
}
.setup-input:focus { border-color: var(--heart-accent); }
.setup-hint { font-size: 10px; color: #bbb; margin-top: 4px; }
.setup-btn {
  margin-top: 18px;
  width: 100%;
  height: 36px;
  background: var(--main-pink);
  border: 2px solid var(--heart-accent);
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  color: var(--heart-accent);
  cursor: pointer;
}
.setup-btn:hover { background: var(--check-pink); }
.setup-error {
  font-size: 11px;
  color: #e05c7a;
  margin-top: 8px;
  text-align: center;
  min-height: 16px;
}

/* ── Widget ── */
.widget-card {
  width: 340px;
  background-color: var(--main-pink);
  padding: 5px;
  border-radius: 12px;
  box-shadow: inset 2px 2px 0px #ffffff, inset -2.5px -2.5px 0px #d9b8c4;
}
.inner-box {
  background: #ffffff;
  border-radius: 8px;
  border: 1.5px solid var(--main-pink);
  overflow: hidden;
}
.header {
  padding: 6px 12px;
  background-color: var(--highlight-bg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 2px solid var(--main-pink);
}
.title-group {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--main-pink);
  font-weight: bold;
  font-size: 14px;
}
.date-badge {
  font-size: 10px;
  color: var(--heart-accent);
  background: var(--check-pink);
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 600;
}
.win-btn {
  background: var(--highlight-bg);
  border: 1px solid var(--main-pink);
  border-radius: 4px;
  width: 25px;
  height: 25px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--main-pink);
}
.input-row {
  padding: 10px 12px;
  display: flex;
  gap: 8px;
  align-items: center;
  border-bottom: 1.5px dotted var(--main-pink);
}
input[type="text"] {
  flex: 1;
  height: 34px;
  padding: 0 10px;
  border: 1px solid var(--item-border);
  border-radius: 4px;
  outline: none;
  font-size: 13px;
}
.add-square-btn {
  width: 34px;
  height: 34px;
  background: var(--highlight-bg);
  border: 2.5px solid var(--main-pink);
  border-radius: 6px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.add-square-btn svg { stroke: var(--main-pink); }
.list-container {
  padding: 12px;
  max-height: 320px;
  overflow-y: auto;
}
.todo-card {
  display: flex;
  align-items: center;
  padding: 10px 12px;
  border: 1.2px solid var(--item-border);
  border-radius: 6px;
  margin-bottom: 8px;
  background: white;
  transition: all 0.2s;
}
.todo-card.highlight { background-color: var(--highlight-bg); border-color: var(--heart-accent); }
.todo-card.highlight .text { color: var(--heart-accent); font-weight: 500; }
.todo-card.checked .text { text-decoration: line-through; color: #ccc; }
.checkbox-custom {
  width: 18px;
  height: 18px;
  border: 1.5px solid var(--check-pink);
  border-radius: 3px;
  margin-right: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.todo-card.checked .checkbox-custom { background-color: var(--check-pink); }
.text { flex: 1; font-size: 14px; color: var(--text-gray); }
.btns { display: flex; gap: 6px; align-items: center; }
.icon-only, .del-icon-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  color: #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
}
.heart-btn.active { color: var(--heart-accent); }
.heart-btn.active svg { fill: var(--heart-accent); }
svg { width: 16px; height: 16px; }
.sync-bar {
  padding: 4px 12px 6px;
  font-size: 10px;
  color: #bbb;
  display: flex;
  align-items: center;
  gap: 5px;
  border-top: 1px solid var(--item-border);
}
.sync-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #ccc;
  flex-shrink: 0;
}
.sync-dot.ok { background: #a8e6c8; }
.sync-dot.err { background: #f9a8b8; }
.sync-dot.loading { background: var(--check-pink); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.empty-msg { text-align: center; color: #ddd; font-size: 12px; padding: 20px 0; }
.spinner { text-align: center; padding: 20px 0; color: var(--check-pink); font-size: 12px; }

<script>
  // ── Vercel API 베이스 URL (배포 후 여기를 본인 URL로 변경) ──
  // 예: const API_BASE = 'https://notion-todo-abc123.vercel.app/api/notion';
  const API_BASE = '/api/notion';

  let DB_ID = '';
  let todayStr = '';

  function init() {
    const d = new Date();
    todayStr = d.toISOString().split('T')[0];
    document.getElementById('dateBadge').textContent =
      `${d.getMonth()+1}/${d.getDate()} (${['일','월','화','수','목','금','토'][d.getDay()]})`;

    const saved = localStorage.getItem('notion_todo_db');
    if (saved) {
      DB_ID = saved;
      document.getElementById('setupOverlay').style.display = 'none';
      loadTodos();
    }
  }

  async function fetchDatabases() {
    const errEl = document.getElementById('setupError');
    errEl.textContent = '';
    const dbList = document.getElementById('dbList');
    dbList.innerHTML = '<div style="color:#bbb;font-size:12px;padding:8px 0;">불러오는 중... 🌸</div>';

    try {
      const res = await apiFetch('/search-databases', 'GET');
      const data = await res.json();

      if (!data.results || data.results.length === 0) {
        dbList.innerHTML = '<div style="color:#e05c7a;font-size:11px;">연결된 DB가 없어요. Integration이 DB에 연결됐는지 확인해 주세요.</div>';
        return;
      }

      dbList.innerHTML = '';
      data.results.forEach(db => {
        const title = db.title?.[0]?.plain_text || '(이름 없음)';
        const btn = document.createElement('button');
        btn.className = 'setup-btn';
        btn.style.marginTop = '6px';
        btn.style.textAlign = 'left';
        btn.style.padding = '0 12px';
        btn.style.fontSize = '12px';
        btn.textContent = `📋 ${title}`;
        btn.onclick = () => selectDb(db.id, title);
        dbList.appendChild(btn);
      });
    } catch(e) {
      errEl.textContent = '불러오기 실패. Vercel에 NOTION_TOKEN이 설정됐는지 확인해 주세요.';
    }
  }

  function selectDb(id, title) {
    DB_ID = id;
    localStorage.setItem('notion_todo_db', id);
    document.getElementById('setupOverlay').style.display = 'none';
    loadTodos();
  }

  // ── API 호출 (Vercel 서버 경유) ──
  function apiFetch(path, method='GET', body=null) {
    // path: "/databases/xxx" → API_BASE + "?path=databases/xxx"
    const cleanPath = path.replace(/^\//, '');
    const url = `${API_BASE}/${cleanPath}`;
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body) opts.body = JSON.stringify(body);
    return fetch(url, opts);
  }

  async function loadTodos() {
    if (!DB_ID) return;
    setSyncState('loading', '불러오는 중...');
    const list = document.getElementById('todoList');
    list.innerHTML = '<div class="spinner">🌸 로딩 중...</div>';

    try {
      const res = await apiFetch(`/databases/${DB_ID}/query`, 'POST', {
        filter: { property: 'Date', date: { equals: todayStr } },
        sorts: [{ property: 'Starred', direction: 'descending' }]
      });
      if (!res.ok) throw new Error();
      const data = await res.json();
      list.innerHTML = '';
      if (!data.results.length) {
        list.innerHTML = '<div class="empty-msg">오늘 할 일이 없어요 🎀</div>';
      } else {
        data.results.forEach(page => renderItem(page));
      }
      setSyncState('ok', `마지막 동기화 ${new Date().toLocaleTimeString('ko-KR', {hour:'2-digit',minute:'2-digit'})}`);
    } catch(e) {
      list.innerHTML = '<div class="empty-msg">불러오기 실패 😢</div>';
      setSyncState('err', '동기화 실패');
    }
  }

  function renderItem(page) {
    const list = document.getElementById('todoList');
    const title = page.properties.Name?.title?.[0]?.plain_text || '(제목 없음)';
    const done = page.properties.Done?.checkbox || false;
    const starred = page.properties.Starred?.checkbox || false;

    const item = document.createElement('div');
    item.className = 'todo-card' + (done ? ' checked' : '') + (starred ? ' highlight' : '');
    item.dataset.pageId = page.id;
    item.innerHTML = `
      <div class="checkbox-custom" onclick="toggleDone(this)">
        <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4"
          style="display:${done?'block':'none'}"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <span class="text">${escHtml(title)}</span>
      <div class="btns">
        <button class="icon-only heart-btn ${starred?'active':''}" onclick="toggleStar(this)">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="${starred?'currentColor':'none'}">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </button>
        <button class="del-icon-btn" onclick="deleteItem(this)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>`;
    list.appendChild(item);
  }

  async function addTodo() {
    const input = document.getElementById('todoInput');
    const val = input.value.trim();
    if (!val || !DB_ID) return;
    input.value = '';
    setSyncState('loading', '추가 중...');

    try {
      const res = await apiFetch('/pages', 'POST', {
        parent: { database_id: DB_ID },
        properties: {
          Name: { title: [{ text: { content: val } }] },
          Done: { checkbox: false },
          Starred: { checkbox: false },
          Date: { date: { start: todayStr } }
        }
      });
      if (!res.ok) throw new Error();
      const page = await res.json();
      const listEl = document.getElementById('todoList');
      const empty = listEl.querySelector('.empty-msg');
      if (empty) empty.remove();
      renderItem(page);
      setSyncState('ok', '추가 완료');
    } catch(e) {
      setSyncState('err', '추가 실패');
    }
  }

  async function toggleDone(el) {
    const card = el.closest('.todo-card');
    const pageId = card.dataset.pageId;
    const isDone = !card.classList.contains('checked');
    card.classList.toggle('checked');
    el.querySelector('.mark').style.display = isDone ? 'block' : 'none';
    try {
      await apiFetch(`/pages/${pageId}`, 'PATCH', { properties: { Done: { checkbox: isDone } } });
      setSyncState('ok', '업데이트 완료');
    } catch(e) { setSyncState('err', '업데이트 실패'); }
  }

  async function toggleStar(btn) {
    const card = btn.closest('.todo-card');
    const pageId = card.dataset.pageId;
    const isStarred = !btn.classList.contains('active');
    btn.classList.toggle('active');
    card.classList.toggle('highlight');
    btn.querySelector('svg').setAttribute('fill', isStarred ? 'currentColor' : 'none');
    if (isStarred) document.getElementById('todoList').prepend(card);
    try {
      await apiFetch(`/pages/${pageId}`, 'PATCH', { properties: { Starred: { checkbox: isStarred } } });
      setSyncState('ok', '업데이트 완료');
    } catch(e) { setSyncState('err', '업데이트 실패'); }
  }

  async function deleteItem(btn) {
    const card = btn.closest('.todo-card');
    const pageId = card.dataset.pageId;
    card.style.opacity = '0.4';
    try {
      await apiFetch(`/pages/${pageId}`, 'PATCH', { archived: true });
      card.remove();
      const list = document.getElementById('todoList');
      if (!list.querySelector('.todo-card')) {
        list.innerHTML = '<div class="empty-msg">오늘 할 일이 없어요 🎀</div>';
      }
      setSyncState('ok', '삭제 완료');
    } catch(e) {
      card.style.opacity = '1';
      setSyncState('err', '삭제 실패');
    }
  }

  function setSyncState(state, msg) {
    document.getElementById('syncDot').className = 'sync-dot ' + state;
    document.getElementById('syncMsg').textContent = msg;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('todoInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') addTodo();
  });

  init();
</script>
